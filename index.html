<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Catálogo CFMOTO San Luis Potosí — Motocicletas, ATV, SSV, UTV y CFLITE. Precios oficiales 2026." />
  <title>CFMOTO San Luis Potosí — Catálogo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="btn-back" id="btnBack" aria-label="Regresar" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">CF</span>
        <div class="brand-text">
          <strong>CFMOTO</strong>
          <span>SAN LUIS POTOSÍ</span>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="foot">
    <p>CFMOTO San Luis Potosí · Av. Venustiano Carranza 1433, Tequisquiapan, SLP</p>
    <p class="foot-note">Catálogo 2026 · Precios sujetos a cambio</p>
  </footer>

  <div class="modal" id="ctaModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <button class="modal-close" data-close aria-label="Cerrar">&times;</button>
      <h3 id="modalTitle">Integración disponible próximamente</h3>
      <p id="modalText">Esta función se conectará pronto con nuestro equipo de ventas por WhatsApp.</p>
      <button class="btn btn-primary btn-block" data-close>Entendido</button>
    </div>
  </div>

  <div id="stickyCta" hidden>
    <button class="btn btn-primary btn-block btn-sticky" data-cta="cotizacion">Quiero cotización</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
